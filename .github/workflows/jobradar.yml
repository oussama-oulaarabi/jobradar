name: Daily JobRadar Aggregator & Notification

on:
  schedule:
    - cron: '0 17 * * *' # Every day at 18:00 (6:00 PM) UTC+1 local time
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to commit the jobs database json file back to the repository
  pages: write
  id-token: write

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run JobRadar Daily Search & Scrapers
        working-directory: ./backend
        env:
          GITHUB_ACTIONS: 'true'
          SERVERLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run scrape

      - name: Commit Updated Jobs Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update daily jobs database [skip ci]"
          file_pattern: "frontend/public/data/jobs.json"
          branch: ${{ github.head_ref || github.ref_name }}

  deploy-dashboard:
    needs: run-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }} # fetch latest changes committed in previous job

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Static Site
        working-directory: ./frontend
        run: npm run build

      - name: Deploy static dashboard to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages # Deploys static build to gh-pages branch
